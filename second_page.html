<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Page - Two Page Site</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font family -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ecfeff; /* Light cyan background */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-8 md:p-12 text-center border-t-8 border-cyan-500">
        
        <header class="mb-8">
            <h1 class="text-5xl font-extrabold text-cyan-700 mb-3">
                This is Page Two
            </h1>
            <p class="text-xl text-gray-500">
                You successfully navigated to a separate file!
            </p>
        </header>

        <main>
            <p class="text-lg text-gray-700 mb-8 leading-relaxed">
                Since this is a distinct file (`second_page.html`), any changes you make here won't affect the homepage. This makes maintenance and structure much cleaner for larger sites.
            </p>

            <!-- Navigation Button to the Homepage -->
            <!-- The href attribute links directly back to index.html -->
            <a href="index.html" class="inline-block px-8 py-3 bg-cyan-600 text-white font-bold text-lg rounded-full shadow-lg hover:bg-cyan-700 focus:outline-none focus:ring-4 focus:ring-cyan-300 transition transform hover:translate-y-[-2px]">
                &larr; Back to Homepage
            </a>
        </main>
        
        <footer class="mt-12 text-sm text-gray-400">
            <p>File: second_page.html</p>
        </footer>
    </div>

</body>
</html>
