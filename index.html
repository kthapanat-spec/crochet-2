<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quick Website</title>
    <style>
        /* This is the CSS (the "Nice UI" part) */
        
        /* 1. Basic Page Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Make the page full height */
            margin: 0;
            color: #333; /* Dark gray text */
        }

        /* 2. The Main Content Box */
        .container {
            text-align: center;
            background-color: #ffffff; /* White background */
            padding: 40px 50px;
            border-radius: 12px; /* Rounded corners */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07); /* Soft shadow */
            max-width: 500px;
        }

        /* 3. The Text */
        h1 {
            font-size: 2.5em; /* Big headline */
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6; /* Easy to read spacing */
            margin-bottom: 30px;
        }

        /* 4. The Button */
        .cta-button {
            display: inline-block;
            background-color: #007aff; /* Bright blue */
            color: #ffffff;
            padding: 14px 28px;
            font-size: 1em;
            font-weight: bold;
            text-decoration: none; /* Remove underline */
            border-radius: 8px; /* Rounded button */
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }

        .cta-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome! 👋</h1>
        <p>
            This is a simple, clean webpage example. You can build on this
            to create something amazing.
        </p>
        <a href="#" class="cta-button">Get Started</a>
    </div>

</body>
</html>
