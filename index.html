<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Two Page Site</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font family -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light gray background */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-8 md:p-12 text-center transform transition duration-500 hover:scale-[1.02]">
        
        <header class="mb-8">
            <h1 class="text-5xl font-extrabold text-gray-900 mb-3">
                Welcome Home!
            </h1>
            <p class="text-xl text-gray-500">
                This is the main entry point of your static website.
            </p>
        </header>

        <main>
            <p class="text-lg text-gray-700 mb-8 leading-relaxed">
                To create a multi-page GitHub site, you simply link to the separate HTML files. Click the button below to navigate to the second page!
            </p>

            <!-- Navigation Button to the Second Page -->
            <!-- The href attribute links directly to the second file name -->
            <a href="second_page.html" class="inline-block px-8 py-3 bg-indigo-600 text-white font-bold text-lg rounded-full shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition transform hover:translate-y-[-2px]">
                Go to Second Page &rarr;
            </a>
        </main>
        
        <footer class="mt-12 text-sm text-gray-400">
            <p>&copy; 2025 Static Website Demo. Hosted on GitHub.</p>
        </footer>
    </div>

</body>
</html>
